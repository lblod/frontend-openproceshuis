variables:
  - &ember_image danlynn/ember-cli:5.12.0-node_20.18

steps:
  install:
    image: *ember_image
    commands:
      - npm ci
  lint:
    image: *ember_image
    depends_on: [install]
    commands:
      - npm run lint
  dependency-lint:
    image: *ember_image
    depends_on: [install]
    commands:
      - npx ember dependency-lint
    failure: ignore
  test:
    image: *ember_image
    depends_on: [install]
    commands:
      - npm run test:ember
    failure: ignore
when:
  event: pull_request
